zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7c2cb727f85b492d88cd56e17127c64d
      name: Templates/SAN
  templates:
    - uuid: 4646f0f0531c4d8b883158f2a0a99c16
      template: 'FC HBA stats Linux by Zabbix agent'
      name: 'FC HBA stats Linux by Zabbix agent'
      description: |
        https://github.com/AndAndr/
        qla2xxx
      groups:
        - name: Templates/SAN
      discovery_rules:
        - uuid: ff44f7bbae9c425f88e9b3f7a668f11c
          name: 'FC discovery'
          key: 'vfs.dir.get[/sys/class/fc_host,,,sym,,0,,,,,]'
          delay: 30m
          filter:
            evaltype: AND
            conditions:
              - macro: '{#FCHOST}'
                value: '{$FCHOST.MATCHES}'
                formulaid: A
              - macro: '{#FCHOST}'
                value: '{$FCHOST.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 3d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Обнаружение портов Fibre Channel (FC) HBA.'
          item_prototypes:
            - uuid: e5f629e8ecde43d2a2e4c63993c57d1c
              name: 'FC {#FCHOST} port state'
              key: 'vfs.file.contents[/sys/class/fc_host/{#FCHOST}/port_state]'
              description: |
                linux/drivers/scsi/scsi_transport_fc.c
                
                0 ⇒ Online
                1 ⇒ Unknown
                2 ⇒ Not Present
                3 ⇒ Offline
                4 ⇒ Blocked
                5 ⇒ Bypassed
                6 ⇒ Diagnostics
                7 ⇒ Linkdown
                8 ⇒ Error
                9 ⇒ Loopback
                10 ⇒ Deleted
                11 ⇒ Marginal
              valuemap:
                name: fc_port_state_names
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      switch (value) {
                          case "Online":
                              return 0;
                          case "Unknown":
                              return 1;
                          case "Not Present":
                              return 2;
                          case "Offline":
                              return 3;
                          case "Blocked":
                              return 4;
                          case "Bypassed":
                              return 5;
                          case "Diagnostics":
                              return 6;
                          case "Linkdown":
                              return 7;
                          case "Error":
                              return 8;
                          case "Loopback":
                              return 9;
                          case "Deleted":
                              return 10;
                          case "Marginal":
                              return 11;
                          default:
                              return 12;
                      }
                      
              tags:
                - tag: component
                  value: 'fc hba'
                - tag: fc_hba
                  value: '{#FCHOST}'
              trigger_prototypes:
                - uuid: 3e3718a629934b38a0612a17c449930f
                  expression: 'last(/FC HBA stats Linux by Zabbix agent/vfs.file.contents[/sys/class/fc_host/{#FCHOST}/port_state])>0 and last(/FC HBA stats Linux by Zabbix agent/vfs.file.contents[/sys/class/fc_host/{#FCHOST}/port_state],#2)=0'
                  name: 'FC {#FCHOST} port state is not Online'
                  priority: AVERAGE
                  tags:
                    - tag: scope
                      value: availability
            - uuid: e15764c0bf544353a32b7044ee60a9eb
              name: 'FC {#FCHOST} speed'
              key: 'vfs.file.contents[/sys/class/fc_host/{#FCHOST}/speed]'
              delay: 10m
              units: Gbit
              preprocessing:
                - type: REGEX
                  parameters:
                    - ^\d+
                    - \0
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 4h
              tags:
                - tag: component
                  value: 'fc hba'
                - tag: fc_hba
                  value: '{#FCHOST}'
            - uuid: 88c75b1467fe4cd182246a32191b51a2
              name: 'FC {#FCHOST} dumped_frames'
              key: 'vfs.file.contents[/sys/class/fc_host/{#FCHOST}/statistics/dumped_frames]'
              delay: 2m
              preprocessing:
                - type: LTRIM
                  parameters:
                    - 0x
                - type: HEX_TO_DECIMAL
                  parameters:
                    - ''
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              tags:
                - tag: component
                  value: 'fc hba'
                - tag: fc_hba
